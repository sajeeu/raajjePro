# CI skeleton (plan §Phase 0): lint + build for both apps, plus dependency
# scanning. Make every job a required status check in branch protection.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — lint, typecheck, build, test, boot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://raajjepro:raajjepro@localhost:5435/raajjepro?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      # The same image developers run locally, so pg_cron and WAL archiving are
      # exercised in CI rather than assumed.
      - name: Start PostgreSQL (docker compose)
        working-directory: .
        run: |
          docker compose up -d --build --wait db
          docker compose ps

      - name: Apply migrations
        run: npm run db:deploy

      - run: npm test

      # A boot must reach the database and see the runner. The heartbeat fires
      # on the minute, so allow it one full minute after migration.
      - name: Boot and confirm the job runner fires
        run: |
          npm start
          for attempt in $(seq 1 14); do
            if npm run --silent jobs:status; then exit 0; fi
            sleep 5
          done
          echo "job runner never fired"; exit 1

      - name: PITR archiving is on
        working-directory: .
        run: scripts/db/pitr-status.sh || true   # informational: a fresh container may not have archived yet

  frontend:
    name: Frontend — analyze, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test
      - run: flutter build apk --debug

  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Known advisories in the installed npm tree, both apps' tooling included.
      - name: npm audit (backend)
        working-directory: backend
        run: npm ci --ignore-scripts && npm audit --audit-level=high
      - name: npm audit (root tooling)
        run: npm ci --ignore-scripts && npm audit --audit-level=high

      # Dart packages have no `audit`; pub outdated at least surfaces what is
      # behind. Dependabot (.github/dependabot.yml) opens the security PRs.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - name: pub outdated (frontend)
        working-directory: frontend
        run: flutter pub get && flutter pub outdated || true

      # Blocks a PR that introduces a dependency with a known vulnerability.
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
