# Automated dependency scanning (plan §Phase 0, Round 15). Dependabot opens a
# PR for every security advisory as it lands, and a weekly batch for routine
# version bumps. CI's `npm audit` and dependency-review-action cover the
# pull-request side; this covers what is already merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript majors are held until typescript-eslint supports them.
      # Dependabot merged 6 -> 7 on 2026-09-05; typescript-eslint 8.69.0 (the
      # latest) peers on ">=4.8.4 <6.1.0", so `npm ci` failed with ERESOLVE on
      # every clean checkout while an already-installed node_modules kept
      # working. CI was red for three runs and local checks stayed green.
      # Lift this when typescript-eslint publishes a release accepting TS 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: pub
    directory: /frontend
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker
    directory: /infra/postgres
    schedule:
      interval: weekly
      day: monday
