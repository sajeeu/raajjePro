name: raajjepro
description: "RaajjePro — local services marketplace for the Maldives. Customer and provider app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  device_info_plus: ^13.2.0
  share_plus: ^13.3.0
  # Pinned to the version share_plus already pulls in transitively
  # (pubspec.lock) — promoted to direct because DownloadController now calls
  # getTemporaryDirectory() itself rather than Directory.systemTemp, which on
  # Android is a directory shared with other apps (final review #5).
  path_provider: 2.1.6
  sentry_flutter: 9.29.0
  # Phase 9's media step. The cover image is one of the six fields required to
  # publish (§0.2 item 4), so a wizard that cannot reach the photo library
  # cannot create a service end-to-end — which is §Phase 9's first Done-when
  # line. Unlike the push and crash vendors it needs no account and no
  # per-project config file, so there is nothing to defer; it still sits
  # behind `core/media/media_picker.dart` so tests never cross a platform
  # channel.
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Inter is bundled, not fetched at runtime: island connectivity drops
  # constantly and a font that arrives late reflows every screen. Weights
  # 500–800 only — nothing lighter appears anywhere in the design (plan
  # §Phase 1 tokens; frontend/CLAUDE.md). A style asking for w400 falls back
  # to Medium, which enforces the rule rather than fighting it.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
