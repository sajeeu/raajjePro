<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#DEE7F3}
a{color:#2563EB}a:hover{color:#1D4ED8}
input,textarea,button,select{font-family:inherit}
input:focus,textarea:focus,button:focus,select:focus{outline:none}
</style>
<link rel="stylesheet" href="./motion.css">
<script src="./session.js"></script>
</helmet>
<div style="min-height:100dvh;display:flex;justify-content:center;align-items:stretch;background:#DEE7F3;font-family:'Inter',system-ui,-apple-system,sans-serif">
<div style="width:100%;max-width:412px;height:100dvh;background:#F2F6FB;display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 60px rgba(15,27,45,.14)">

<div style="flex:none;display:flex;align-items:center;gap:12px;padding:14px 20px 12px;background:#F7FAFD;border-bottom:1px solid #EEF3FA">
  <button onClick="{{ back }}" aria-label="Back" style="width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid #E3EAF3;display:flex;align-items:center;justify-content:center;color:#0F1B2D;flex:none;cursor:pointer;box-shadow:0 1px 2px rgba(15,27,45,.05)" style-hover="background:#EDF3FB"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></button>
  <div style="flex:1;display:flex;flex-direction:column;gap:1px;min-width:0">
    <div style="font-size:19px;font-weight:800;letter-spacing:-.02em;color:#0F1B2D">{{ title }}</div>
    <div style="font-size:12px;font-weight:600;color:#5B6B84">{{ subtitle }}</div>
  </div>
</div>

<div style="flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch">

<sc-if value="{{ isIndex }}" hint-placeholder-val="{{ true }}">
<div data-screen-label="Legal" style="padding:16px 20px 26px;display:flex;flex-direction:column;gap:12px;animation:fadeUp var(--m-page) var(--e-out) both">
  <sc-for list="{{ docs }}" as="d" hint-placeholder-count="4">
    <button onClick="{{ d.open }}" style="display:flex;align-items:center;gap:13px;background:#fff;border:1px solid #E9EFF7;border-radius:20px;padding:12px 15px;cursor:pointer;text-align:left;width:100%;box-shadow:0 1px 3px rgba(15,27,45,.05)" style-hover="border-color:#CDDDFB">
      <span style="width:46px;height:46px;border-radius:50%;background:#E8F0FE;display:flex;align-items:center;justify-content:center;flex:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v13H7zM14 3v5h5M10.5 12.5h5M10.5 16h5"></path></svg></span>
      <span style="flex:1;display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:15px;font-weight:750;color:#0F1B2D">{{ d.name }}</span><span style="font-size:12.5px;font-weight:600;color:#5B6B84">Last updated {{ d.updated }}</span></span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA9C0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M9 6l6 6-6 6"></path></svg>
    </button>
  </sc-for>
</div>
</sc-if>

<sc-if value="{{ isDoc }}" hint-placeholder-val="{{ false }}">
<div data-screen-label="Legal — document" style="padding:16px 20px 40px;display:flex;flex-direction:column;gap:16px;animation:fadeUp var(--m-page) var(--e-out) both">
  <div style="display:flex;align-items:flex-start;gap:10px;background:#FFF7E8;border:1px solid #F3DFB4;border-radius:16px;padding:12px 14px">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:1px"><path d="M12 3L2.5 20h19zM12 10v4M12 17v.1"></path></svg>
    <span style="font-size:12.5px;font-weight:700;line-height:1.5;color:#92600A">Placeholder — legal text pending review. Headings show the structure; the body is not final policy.</span>
  </div>
  <div style="background:#fff;border:1px solid #E9EFF7;border-radius:24px;padding:22px 20px;display:flex;flex-direction:column;gap:20px;box-shadow:0 1px 3px rgba(15,27,45,.05)">
    <div style="display:flex;flex-direction:column;gap:4px">
      <div style="font-size:21px;font-weight:800;letter-spacing:-.02em;color:#0F1B2D">{{ docName }}</div>
      <div style="font-size:12.5px;font-weight:600;color:#8296B3">Last updated {{ docUpdated }}</div>
    </div>
    <sc-for list="{{ sections }}" as="s" hint-placeholder-count="5">
      <div style="display:flex;flex-direction:column;gap:10px">
        <div style="font-size:15px;font-weight:800;color:#0F1B2D">{{ s.h }}</div>
        <sc-if value="{{ s.hasReal }}" hint-placeholder-val="{{ false }}"><div style="font-size:13.5px;font-weight:600;line-height:1.65;color:#41526B;text-wrap:pretty">{{ s.real }}</div></sc-if>
        <sc-for list="{{ s.bars }}" as="b" hint-placeholder-count="3">
          <div style="height:11px;border-radius:6px;width:{{ b }};background:repeating-linear-gradient(-45deg,#EDF2F9 0 6px,#F6F9FC 6px 12px)"></div>
        </sc-for>
        <div style="font-family:ui-monospace,monospace;font-size:10.5px;font-weight:600;color:#B7C3D4;letter-spacing:.03em">[ placeholder — pending legal review ]</div>
      </div>
    </sc-for>
  </div>
</div>
</sc-if>

<sc-if value="{{ isLoading }}" hint-placeholder-val="{{ false }}">
<div data-screen-label="Legal — loading" aria-hidden="true" style="animation:fadeUp var(--m-page) var(--e-out) both;padding:16px 20px 26px;display:flex;flex-direction:column;gap:12px">
  <sc-for list="{{ skels }}" as="k" hint-placeholder-count="4">
    <div style="background:#fff;border:1px solid #E9EFF7;border-radius:20px;padding:12px 15px;display:flex;gap:13px;align-items:center">
      <div style="width:46px;height:46px;border-radius:50%;flex:none;background:linear-gradient(90deg,#E8EEF6 25%,#F4F8FC 50%,#E8EEF6 75%);background-size:200% 100%;animation:shimmer 1.4s linear infinite"></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:8px">
        <div style="height:13px;width:45%;border-radius:7px;background:linear-gradient(90deg,#E8EEF6 25%,#F4F8FC 50%,#E8EEF6 75%);background-size:200% 100%;animation:shimmer 1.4s linear infinite"></div>
        <div style="height:11px;width:60%;border-radius:6px;background:linear-gradient(90deg,#E8EEF6 25%,#F4F8FC 50%,#E8EEF6 75%);background-size:200% 100%;animation:shimmer 1.4s linear infinite"></div>
      </div>
    </div>
  </sc-for>
</div>
</sc-if>

<sc-if value="{{ isError }}" hint-placeholder-val="{{ false }}">
<div data-screen-label="Legal — error" style="animation:fadeUp var(--m-page) var(--e-out) both;padding:60px 20px;display:flex;justify-content:center">
  <dc-import name="EmptyState" icon="pin" title="Couldn't load documents" body="Your connection may have dropped. Try again." action-label="Try again" on-action="{{ retry }}" hint-size="340px,220px"></dc-import>
</div>
</sc-if>

</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;index&quot;,&quot;document&quot;,&quot;loading&quot;,&quot;error&quot;],&quot;default&quot;:&quot;index&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;State&quot;},&quot;document&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;terms&quot;,&quot;privacy&quot;,&quot;provider&quot;,&quot;trust&quot;],&quot;default&quot;:&quot;trust&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;State&quot;}}">
class Component extends DCLogic {
  state = { view:null, docId:null };
  DOCS = [
    { id:'terms', name:'Terms of Service', updated:'12 Aug 2026', sections:['1. Accepting these terms','2. Your account','3. Bookings and payment','4. Acceptable use','5. Changes to these terms'] },
    { id:'privacy', name:'Privacy Policy', updated:'12 Aug 2026', sections:['1. What we collect','2. How we use it','3. Sharing','4. Retention and deletion','5. Your choices'] },
    { id:'provider', name:'Provider Agreement', updated:'30 Jul 2026', sections:['1. Listing your services','2. Verification','3. Bookings and conduct','4. Reviews','5. Ending the agreement'] },
    { id:'trust', name:'Trust & Safety', updated:'12 Aug 2026', real:{ h:'1. What RaajjePro is', text:'RaajjePro is a marketplace that connects customers with independent service providers. RaajjePro is not the supplier of the work — each booking is an agreement between you and the provider.' }, sections:['1. What RaajjePro is','2. Verification of providers','3. Reporting a problem','4. Reviews and integrity','5. Enforcement'] } ];
  BARS = [['96%','88%','62%'],['92%','97%','74%'],['90%','58%'],['95%','85%','70%'],['89%','66%']];
  renderVals(){
    const view = this.state.view ?? this.props.state ?? 'index';
    const docId = this.state.docId ?? this.props.document ?? 'trust';
    const doc = this.DOCS.find(d => d.id === docId) || this.DOCS[3];
    return {
      isIndex: view === 'index', isDoc: view === 'document', isLoading: view === 'loading', isError: view === 'error',
      title: view === 'document' ? doc.name : 'Legal',
      subtitle: view === 'document' ? 'Last updated ' + doc.updated : 'Terms, privacy and agreements',
      docs: this.DOCS.map(d => ({ ...d, open: () => this.setState({ view:'document', docId:d.id }) })),
      docName: doc.name, docUpdated: doc.updated,
      sections: doc.sections.map((h, i) => {
        const real = doc.real && doc.real.h === h;
        return { h, hasReal: real, real: real ? doc.real.text : '', bars: real ? this.BARS[i].slice(0,1) : this.BARS[i % this.BARS.length] }; }),
      skels:[1,2,3,4],
      back: () => { if (view === 'document') this.setState({ view:'index' }); else window.location = 'Profile.dc.html'; },
      retry: () => this.setState({ view:'index' }),
    };
  }
}
</script>
</body>
</html>
