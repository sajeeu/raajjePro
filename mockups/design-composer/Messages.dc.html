<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#DEE7F3}
a{color:#2563EB}a:hover{color:#1D4ED8}
input,textarea,button,select{font-family:inherit}
button:focus{outline:none}
</style>
<link rel="stylesheet" href="./motion.css">
<script src="./session.js"></script>
</helmet>
<div style="min-height:100dvh;display:flex;justify-content:center;align-items:stretch;background:#DEE7F3;font-family:'Inter',system-ui,-apple-system,sans-serif">
<div style="width:100%;max-width:412px;height:100dvh;background:#F2F6FB;display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 60px rgba(15,27,45,.14)">

<div style="flex:none;padding:20px 20px 12px">
  <span style="font-size:22px;font-weight:800;letter-spacing:-.02em;color:#0F1B2D">Messages</span>
</div>

<sc-if value="{{ isLoading }}">
<div data-screen-label="Messages — loading" aria-hidden="true" style="animation:fadeUp var(--m-page) var(--e-out) both;flex:1;padding:2px 16px;display:flex;flex-direction:column;gap:10px;overflow:hidden">
  <sc-for list="{{ skels }}" as="k" hint-placeholder-count="4">
    <div style="background:#fff;border:1px solid #E9EFF7;border-radius:20px;padding:13px 14px;display:flex;gap:12px;align-items:center">
      <div style="width:46px;height:46px;border-radius:50%;flex:none;background:linear-gradient(90deg,#E8EEF6 25%,#F4F8FC 50%,#E8EEF6 75%);background-size:200% 100%;animation:shimmer 1.4s linear infinite"></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:8px">
        <div style="height:13px;width:55%;border-radius:7px;background:linear-gradient(90deg,#E8EEF6 25%,#F4F8FC 50%,#E8EEF6 75%);background-size:200% 100%;animation:shimmer 1.4s linear infinite"></div>
        <div style="height:11px;width:80%;border-radius:6px;background:linear-gradient(90deg,#E8EEF6 25%,#F4F8FC 50%,#E8EEF6 75%);background-size:200% 100%;animation:shimmer 1.4s linear infinite"></div>
      </div>
    </div>
  </sc-for>
</div>
<div style="flex:none;display:flex;justify-content:center;padding:10px 20px 14px"><dc-import name="BottomNav" active="Messages" hint-size="372px,90px"></dc-import></div>
</sc-if>

<sc-if value="{{ isError }}">
<div data-screen-label="Messages — error" style="animation:fadeUp var(--m-page) var(--e-out) both;flex:1;display:flex;align-items:center;justify-content:center;padding:20px">
  <dc-import name="EmptyState" icon="message" title="Couldn't load your messages" body="Your connection may have dropped. Nothing is lost — every conversation is safe. Try again." action-label="Try again" on-action="{{ retry }}" hint-size="340px,220px"></dc-import>
</div>
<div style="flex:none;display:flex;justify-content:center;padding:10px 20px 14px"><dc-import name="BottomNav" active="Messages" hint-size="372px,90px"></dc-import></div>
</sc-if>

<sc-if value="{{ isEmpty }}">
<div data-screen-label="Messages — empty" style="animation:fadeUp var(--m-page) var(--e-out) both;flex:1;display:flex;align-items:center;justify-content:center;padding:20px">
  <dc-import name="EmptyState" icon="message" title="No messages yet" body="Message a service from its page, or book one — every booking opens its own chat, and it all lives here." action-label="Explore services" on-action="{{ goExplore }}" hint-size="340px,230px"></dc-import>
</div>
<div style="flex:none;display:flex;justify-content:center;padding:10px 20px 14px"><dc-import name="BottomNav" active="Messages" hint-size="372px,90px"></dc-import></div>
</sc-if>

<sc-if value="{{ isList }}" hint-placeholder-val="{{ true }}">
<div data-screen-label="Messages" style="animation:fadeUp var(--m-page) var(--e-out) both;flex:1;padding:2px 16px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;-webkit-overflow-scrolling:touch">
  <sc-for list="{{ threads }}" as="t" hint-placeholder-count="2">
    <a href="{{ t.href }}" style="display:flex;gap:12px;padding:13px 14px;background:#fff;border:1px solid #E9EFF7;border-radius:20px;text-decoration:none;box-shadow:0 1px 3px rgba(15,27,45,.05);align-items:center" style-hover="border-color:#CDDDFB">
      <span style="width:46px;height:46px;border-radius:50%;background:{{ t.avBg }};color:{{ t.avFg }};display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex:none">{{ t.initials }}</span>
      <span style="flex:1;display:flex;flex-direction:column;gap:4px;min-width:0">
        <span style="display:flex;align-items:center;gap:8px">
          <span style="flex:1;font-size:13.5px;font-weight:800;color:#0F1B2D;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ t.name }}</span>
          <span style="font-size:11px;font-weight:700;color:{{ t.ageFg }};font-variant-numeric:tabular-nums;flex:none">{{ t.age }}</span>
        </span>
        <span style="display:flex;align-items:center;gap:6px;min-width:0">
          <span style="flex:none;display:inline-flex;align-items:center;background:{{ t.kBg }};color:{{ t.kFg }};border:1px solid {{ t.kBd }};border-radius:999px;padding:1.5px 7px;font-size:9.5px;font-weight:800">{{ t.kind }}</span>
          <span style="font-size:11.5px;font-weight:600;color:#5B6B84;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ t.concern }}</span>
        </span>
        <span style="display:flex;align-items:center;gap:8px">
          <span style="flex:1;font-size:12.5px;font-weight:{{ t.lastW }};color:{{ t.lastFg }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ t.last }}</span>
          <sc-if value="{{ t.unread }}" hint-placeholder-val="{{ false }}"><span style="width:9px;height:9px;border-radius:50%;background:#2563EB;flex:none"></span></sc-if>
        </span>
      </span>
    </a>
  </sc-for>
</div>
<div style="flex:none;display:flex;justify-content:center;padding:10px 20px 14px"><dc-import name="BottomNav" active="Messages" hint-size="372px,90px"></dc-import></div>
</sc-if>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:412,&quot;height&quot;:900},&quot;scenario&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;populated&quot;,&quot;empty&quot;,&quot;loading&quot;,&quot;error&quot;],&quot;default&quot;:&quot;populated&quot;,&quot;tsType&quot;:&quot;'populated' | 'empty' | 'loading' | 'error'&quot;,&quot;section&quot;:&quot;State&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const sc = this.state.scnOverride ?? this.props.scenario ?? 'populated';
    const isLoading = sc === 'loading', isError = sc === 'error', isEmpty = sc === 'empty';
    const KIND = {
      enquiry: { label: 'Enquiry', bg: '#EEF3FA', fg: '#41526B', bd: '#E1EAF5' },
      booking: { label: 'Booking', bg: '#E8F0FE', fg: '#1D4ED8', bd: '#CDDDFB' } };
    const raw = [
      { name: 'Ibrahim Rasheed', initials: 'IR', avBg: '#E5F6EC', avFg: '#166534', kind: 'enquiry',
        concern: 'Emergency Plumbing & Pipe Repair', last: "I'll be there in 20 minutes", age: '4m',
        unread: true, href: 'Enquiry%20Thread.dc.html' },
      { name: 'Mariyam Shifa', initials: 'MS', avBg: '#E8F0FE', avFg: '#1D4ED8', kind: 'booking',
        concern: 'Home Deep Cleaning \u00b7 Tue 25 Aug', last: 'See you Tuesday', age: '2d',
        unread: false, href: 'Booking%20Thread.dc.html' } ];
    return {
      isLoading, isError, isEmpty, isList: !isLoading && !isError && !isEmpty,
      skels: [1, 2, 3, 4],
      threads: raw.map(t => { const k = KIND[t.kind]; return { ...t,
        kind: k.label, kBg: k.bg, kFg: k.fg, kBd: k.bd,
        ageFg: t.unread ? '#1D4ED8' : '#9AA9C0',
        lastFg: t.unread ? '#0F1B2D' : '#8296B3',
        lastW: t.unread ? '700' : '600' }; }),
      goExplore: () => { window.location = 'Discovery.dc.html'; },
      retry: () => this.setState({ scnOverride: 'populated' })
    };
  }
}
</script>
</body>
</html>
